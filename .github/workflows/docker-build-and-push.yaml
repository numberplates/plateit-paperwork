name: Build and Push Docker Image

on:
  push:
    branches:
      - master

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: GitHub Container Registry Log In
        run: |
          echo "${{ secrets.PERSONAL_ACCESS_TOKEN }}" | docker login ghcr.io --username numberplates --password-stdin

      - name: Build Docker Image
        run: |
          docker build . -t ghcr.io/numberplates/plateit-paperwork:latest

      - name: Push Docker Image
        run: |
          docker push ghcr.io/numberplates/plateit-paperwork:latest
